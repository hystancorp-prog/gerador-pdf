spring.application.name=gerador-pdf
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Banco de dados
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=12MB
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# Firebase JWT — FIREBASE_PROJECT_ID must be set as Railway env var
# JWK URI is Firebase's public key endpoint (no credentials needed)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com